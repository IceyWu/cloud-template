name: Publish frontend demo image

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-demo-frontend-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.pull_request.merged == true &&
      (contains(github.event.pull_request.labels.*.name, 'demo-update') ||
      github.event.pull_request.title == 'chore: release packages')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        id: image
        with:
          context: .
          push: true
          tags: ghcr.io/iceywu/lev-stack-demo-frontend:sha-${{ github.event.pull_request.merge_commit_sha }}
          build-args: |
            VITE_BASE_URL=/
            VITE_API_BASE_URL=https://api-demo.tonomemo.com/api
            VITE_KNOBBLE_SERVER_URL=https://api-demo.tonomemo.com/api
          cache-from: type=gha,scope=lev-stack-demo-frontend
          cache-to: type=gha,scope=lev-stack-demo-frontend,mode=max,ignore-error=true
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.DEMO_SYNC_APP_ID }}
          private-key: ${{ secrets.DEMO_SYNC_APP_PRIVATE_KEY }}
          owner: IceyWu
          repositories: lev-stack-demo
          permission-contents: write
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: IceyWu/lev-stack-demo
          event-type: component-image-ready
          client-payload: |
            {
              "component": "frontend",
              "repository": "IceyWu/cloud-template",
              "source_sha": "${{ github.event.pull_request.merge_commit_sha }}",
              "image": "ghcr.io/iceywu/lev-stack-demo-frontend",
              "digest": "${{ steps.image.outputs.digest }}",
              "source_pr_number": ${{ github.event.pull_request.number }},
              "source_pr_url": "${{ github.event.pull_request.html_url }}"
            }
